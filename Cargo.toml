[package]
name = "ticky"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Custom keyboard and mouse sounds for Windows"

[dependencies]
slint = "1"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
] }
rodio = { version = "0.19", default-features = false, features = ["wav"] }

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
strip = "symbols"
